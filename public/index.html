<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup Studio</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/",
  "mp4-muxer": "./vendor/mp4-muxer/mp4-muxer.mjs"
} }
</script>
</head>
<body>
<div id="app">
  <!-- left: mockups -->
  <aside class="card" id="colLeft">
    <div class="card-head"><span>Mockups</span></div>
    <div class="tabs2" id="modeTabs"><button data-view="mockup" class="on">Mockup</button><button data-view="dribbble">Dribbble</button></div>
    <div id="tabMockups">
      <div class="search"><input id="search" type="text" placeholder="Search mockups" spellcheck="false"></div>
      <ul id="mockList" class="list"></ul>
    </div>
    <div id="tabProjects" hidden><ul id="projList" class="list"></ul></div>
    <div id="finishBox"></div>
    <div class="row2 leftfoot"><button id="btnSaveProject" class="dashed">Save to project</button><button id="btnProjects" class="dashed" title="Open a saved project">Projects</button></div>
  </aside>

  <!-- second: transform + light -->
  <aside class="card scroll" id="colTransform"></aside>

  <!-- centre: canvas -->
  <main id="stage">
    <div id="topTabs"><div id="outBar"></div></div>
    <div id="guide" hidden></div>
    <canvas id="view"></canvas>
    <div id="safe" hidden></div>
    <div id="loading">Loading scene…</div>
    <button id="btnFull" class="roundbtn" title="Fullscreen preview">⛶</button>
  </main>

  <!-- right: settings -->
  <aside class="card scroll" id="colRight"></aside>

  <!-- bottom: timeline -->
  <footer id="timeline">
    <div class="tl-top">
      <button id="btnPlay" class="sq" title="Play / pause">▶</button>
      <button id="btnKey" class="sq" title="Add / remove keyframe at the playhead">◇</button>
      <button id="btnMotion" class="sq" title="Motion presets &amp; keyframes">↻</button>
      <button id="btnAdd" class="sq" title="Add video / image">+</button>
      <button id="btnSpeed" class="sq" title="Video speed">1×</button>
      <button id="btnTrim" class="sq" title="Trim: cut the start or end of the video">✂</button>
      <label class="dur"><input id="durIn" type="number" min="0" max="120" step="1"><span>s</span></label>
      <span id="status" class="status"></span>
      <div class="grow"></div>
      <span id="time">0:00 / 0:00</span>
      <button id="btnExport" class="white">⤓ Export</button>
    </div>
    <div id="ruler"><div id="ticks"></div><div id="playhead"><span id="phLabel">0.0s</span></div></div>
    <div id="track"><span>Shot 1</span></div>
    <div id="trimRow" hidden>
      <span class="tlbl">Trim</span>
      <div id="trimBar"><div id="trimSel"><i class="h l" title="Drag to cut the start"></i><i class="h r" title="Drag to cut the end"></i></div><div id="trimHead"></div></div>
      <span id="trimInfo"></span>
      <button id="trimIn" class="tbtn" title="Cut everything before the playhead">Start here</button>
      <button id="trimOut" class="tbtn" title="Cut everything after the playhead">End here</button>
      <button id="trimReset" class="tbtn" title="Back to the full length">Reset</button>
    </div>
  </footer>
</div>

<div id="exportBar" hidden>
  <div id="exportMsg"></div>
  <div class="bar"><div id="exportFill"></div></div>
  <button id="btnCancel">Cancel</button>
</div>
<div id="popMotion" class="pop" hidden></div>
<div id="popSpeed" class="pop" hidden></div>
<div id="popExport" class="pop" hidden></div>

<input id="fileVideo" type="file" accept="video/*,image/*" hidden>
<input id="fileBg" type="file" accept="image/*" hidden>
<input id="fileLogo" type="file" accept="image/*" hidden>
<input id="fileWall" type="file" accept="image/*" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
