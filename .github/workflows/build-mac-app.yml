# Builds the Mockup Studio Mac app (Apple Silicon .dmg + .zip) on a GitHub-hosted Mac.
# Run it from the Actions tab ("Build Mac app" → Run workflow); the files appear under the run's Artifacts.
name: Build Mac app

on:
  workflow_dispatch:

permissions:
  contents: write              # to attach the app to a draft release

jobs:
  build:
    runs-on: macos-15            # Apple Silicon runner (macos-14 was retired)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web app dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Prepare static files
        run: npm run build

      - name: Install desktop dependencies
        working-directory: desktop
        # the Electron download sometimes times out (504): try up to 3 times
        run: for i in 1 2 3; do npm ci && exit 0; echo "npm ci failed (try $i), retrying in 20 s"; sleep 20; done; exit 1

      - name: Build the .dmg
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no Apple Developer certificate: ad-hoc signed by scripts/adhoc-sign.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: mockup-studio-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          compression-level: 0
          retention-days: 14

      # also attach the files to a draft release (only visible to people with access to the repo), named after the app version
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./desktop/package.json').version")
          gh release view "mac-v$v" >/dev/null 2>&1 || gh release create "mac-v$v" --draft --target "$GITHUB_SHA" --title "Mockup Studio $v (Mac)" --notes "Apple Silicon build of Mockup Studio $v. Ad-hoc signed: first open with right-click → Open."
          gh release upload "mac-v$v" desktop/dist/*.dmg desktop/dist/*.zip --clobber
